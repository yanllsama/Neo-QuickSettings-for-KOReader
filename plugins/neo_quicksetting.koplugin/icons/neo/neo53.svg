<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">

  <!-- Tracks -->
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#2D3748" />
  <rect x="62" y="20" width="8" height="60" rx="4" fill="#2D3748" />
  
  <!-- Notches left -->
  <line x1="20" y1="30" x2="28" y2="30" stroke="#2D3748" stroke-width="2" />
  <line x1="20" y1="50" x2="28" y2="50" stroke="#2D3748" stroke-width="2" />
  <line x1="20" y1="70" x2="28" y2="70" stroke="#2D3748" stroke-width="2" />
  
  <!-- Notches right -->
  <line x1="72" y1="30" x2="80" y2="30" stroke="#2D3748" stroke-width="2" />
  <line x1="72" y1="50" x2="80" y2="50" stroke="#2D3748" stroke-width="2" />
  <line x1="72" y1="70" x2="80" y2="70" stroke="#2D3748" stroke-width="2" />
  
  <!-- Knobs -->
  <rect x="25" y="45" width="18" height="10" rx="2" fill="#4FD1C5" />
  <rect x="57" y="65" width="18" height="10" rx="2" fill="#4FD1C5" />

</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  
  <!-- E-Reader Tablet (Background Right) -->
  <rect x="40" y="10" width="55" height="65" rx="5" ry="5" fill="#2D3748" />
  <!-- E-Reader Screen -->
  <rect x="45" y="15" width="45" height="45" rx="2" ry="2" fill="#EDF2F7" />
  <!-- E-Reader Home Button -->
  <rect x="60" y="66" width="15" height="3" rx="1.5" ry="1.5" fill="#EDF2F7" />

  <!-- "K" inside screen -->
  <line x1="55" y1="23" x2="55" y2="35" stroke="#2D3748" stroke-width="4" stroke-linecap="round" />
  <line x1="62" y1="23" x2="55" y2="29" stroke="#2D3748" stroke-width="4" stroke-linecap="round" />
  <line x1="55" y1="29" x2="62" y2="35" stroke="#2D3748" stroke-width="4" stroke-linecap="round" />

  <!-- "O" inside screen -->
  <circle cx="72" cy="29" r="6" stroke="#2D3748" stroke-width="4" fill="none" />

  <!-- Small Book inside screen -->
  <path d="M 50 45 Q 60 41 67 45 Q 74 41 84 45 L 84 52 Q 74 48 67 52 Q 60 48 50 52 Z" fill="#2D3748" />

  <!-- Layered Cyan Book (Foreground Left) -->
  <!-- Layer 1 (Back) -->
  <path d="M 40 15 Q 22 10 5 15 L 5 60 Q 22 55 40 60 Z" fill="#81E6D9" />
  <!-- Layer 2 (Middle) -->
  <path d="M 45 20 Q 27 15 10 20 L 10 65 Q 27 60 45 65 Z" fill="#4FD1C5" />
  <!-- Layer 3 (Front) -->
  <path d="M 50 25 Q 32 20 15 25 L 15 70 Q 32 65 50 70 Z" fill="#319795" />

  <!-- NEO Text at the bottom -->
  <!-- N -->
  <polyline points="28,95 28,80 40,95 40,80" stroke="#319795" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <!-- E -->
  <polyline points="53,80 45,80 45,95 53,95" stroke="#319795" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" />
  <line x1="45" y1="87.5" x2="51" y2="87.5" stroke="#319795" stroke-width="4" stroke-linecap="round" />
  <!-- O -->
  <circle cx="65.5" cy="87.5" r="7.5" stroke="#319795" stroke-width="4" fill="none" />

</svg>
